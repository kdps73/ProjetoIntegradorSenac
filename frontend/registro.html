<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/registro.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ======================== CARROSSEL DE FUNDO (CSS ONLY) ======================== -->
    <div class="carousel-bg">
        <img src="img/filme.1.jpg" class="carousel-slide slide-1" alt="Filme 1">
        <img src="img/filme2.jpg" class="carousel-slide slide-2" alt="Filme 2">
        <img src="img/filme3.jpg" class="carousel-slide slide-3" alt="Filme 3">
        <img src="img/filme4.jpg" class="carousel-slide slide-4" alt="Filme 4">
        <img src="img/filme.5.jpg" class="carousel-slide slide-5" alt="Filme 5">
    </div>

    <!-- ======================== OVERLAY ESCURO ======================== -->
    <div class="carousel-overlay"></div>

    <!-- ======================== FORMULÁRIO DE REGISTRO ======================== -->
    <div class="register-container">
        <!-- Ícone de cinema vermelho -->
        <div class="icon-container">
            <svg class="cinema-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="16" width="48" height="36" rx="4" fill="#e50914"/>
                <rect x="12" y="20" width="8" height="6" rx="1" fill="#1a0000"/>
                <rect x="24" y="20" width="8" height="6" rx="1" fill="#1a0000"/>
                <rect x="36" y="20" width="8" height="6" rx="1" fill="#1a0000"/>
                <rect x="12" y="42" width="8" height="6" rx="1" fill="#1a0000"/>
                <rect x="24" y="42" width="8" height="6" rx="1" fill="#1a0000"/>
                <rect x="36" y="42" width="8" height="6" rx="1" fill="#1a0000"/>
                <rect x="16" y="30" width="24" height="10" rx="2" fill="#1a0000"/>
                <circle cx="28" cy="35" r="3" fill="#e50914"/>
                <polygon points="27,33 30,35 27,37" fill="#1a0000"/>
                <!-- Olhinhos -->
                <circle cx="22" cy="10" r="3" fill="#e50914"/>
                <circle cx="42" cy="10" r="3" fill="#e50914"/>
                <circle cx="22" cy="10" r="1.5" fill="#1a0000"/>
                <circle cx="42" cy="10" r="1.5" fill="#1a0000"/>
            </svg>
        </div>

        <h2>Criar conta</h2>
        <p class="subtitle">Preencha os campos para se registrar</p>

        <form id="registerForm">
            <div class="input-group">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="8" r="4" stroke="#888" stroke-width="2" fill="none"/>
                    <path d="M5 20C5 16.686 8.134 14 12 14C15.866 14 19 16.686 19 20" stroke="#888" stroke-width="2" fill="none"/>
                </svg>
                <input type="text" id="username" placeholder="Nome de usuário" required>
            </div>

            <div class="input-group">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="5" width="20" height="14" rx="2" stroke="#888" stroke-width="2" fill="none"/>
                    <path d="M2 7L12 13L22 7" stroke="#888" stroke-width="2" fill="none"/>
                </svg>
                <input type="email" id="email" placeholder="E-mail" required>
            </div>

            <div class="input-group">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="11" width="14" height="10" rx="2" stroke="#888" stroke-width="2" fill="none"/>
                    <path d="M8 11V7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7V11" stroke="#888" stroke-width="2" fill="none"/>
                </svg>
                <input type="password" id="password" placeholder="Senha" required>
            </div>

            <div class="input-group">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="11" width="14" height="10" rx="2" stroke="#888" stroke-width="2" fill="none"/>
                    <path d="M8 11V7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7V11" stroke="#888" stroke-width="2" fill="none"/>
                </svg>
                <input type="password" id="confirmPassword" placeholder="Confirmar senha" required>
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <p class="divider">ou</p>
        <p class="login-link">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </div>

</body>
</html>
